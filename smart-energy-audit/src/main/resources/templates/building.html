
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Building Details | ECOPULSE</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            background: #f1f5f9;
            font-family: Arial, sans-serif;
            color: #172033;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
        }

        .panel {
            background: white;
            padding: 28px;
            border-radius: 12px;
        }

        label {
            display: block;
            margin: 18px 0 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            margin-top: 22px;
            padding: 12px 18px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            color: #087f5b;
        }

        .success {
            color: #047857;
            background: #ecfdf5;
            padding: 12px;
        }

        .error {
            color: #b91c1c;
            background: #fef2f2;
            padding: 12px;
        }
    </style>
</head>

<body>
<div class="container">

    <a th:href="@{/}">← Dashboard</a>

    <section class="panel">
        <h1>Building Details</h1>

        <p>
            Enter the building name and total floor area.
            ECOPULSE will use this information to calculate
            energy intensity in kWh/m².
        </p>

        <p class="success" th:if="${param.saved}">
            Building details saved successfully.
        </p>

        <p class="error" th:if="${param.error}">
            Enter a building name and a floor area greater than zero.
        </p>

        <form th:action="@{/building}"
              th:object="${buildingProfile}"
              method="post">

            <label for="buildingName">Building name</label>
            <input id="buildingName"
                   type="text"
                   th:field="*{buildingName}"
                   placeholder="e.g. Academic Block A"
                   required>

            <label for="floorAreaSqm">Total floor area (m²)</label>
            <input id="floorAreaSqm"
                   type="number"
                   th:field="*{floorAreaSqm}"
                   min="0.1"
                   step="0.1"
                   placeholder="e.g. 1500"
                   required>

            <button type="submit">Save Building Details</button>
        </form>
    </section>
</div>
</body>
</html>
